[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "regressa-sdk"
version = "0.1.0"
description = "Regressa SDK for Python - wrap OpenAI / Anthropic clients and stream LLM traces to Regressa."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Regressa" }]
keywords = ["llm", "observability", "openai", "anthropic", "regression", "evals", "regressa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://regressa.dev"
Documentation = "https://docs.regressa.dev"

[tool.hatch.build.targets.wheel]
packages = ["regressa"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
