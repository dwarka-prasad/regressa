name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @regressa/web build
        env: { DATABASE_URL: "postgres://x:x@localhost:5432/regressa_test", NEXTAUTH_SECRET: ci }
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/sdk-python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/sdk-go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./... && go test ./...
  java:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/sdk-java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: mvn -B -q test
