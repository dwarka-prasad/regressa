name: Feature request
description: Propose something new
labels: [roadmap]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do and what gets in the way? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: How should it work? Sketch the UI or API if you can. }
  - type: checkboxes
    id: help
    attributes: { label: Contribution, options: [{ label: I am willing to implement this }] }
