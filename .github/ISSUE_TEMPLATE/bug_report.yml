name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did, what you expected, what you saw. Include the page or endpoint. }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes: { label: Area, options: [dashboard, ingest-api, worker, sdk-node, sdk-python, sdk-go, sdk-java, docs, infra] }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Logs or screenshots, render: shell }
  - type: input
    id: version
    attributes: { label: Version or commit, placeholder: e.g. e9ee4bd }
